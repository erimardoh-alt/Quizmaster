<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QuizMaster - Trivia de Química Orgánica & Inorgánica</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            obsidian: {
              bg: '#090D16',
              surface: '#111827',
              card: '#161F33',
              border: '#263554',
            },
            neon: {
              cyan: '#00E5FF',
              dim: '#00B4D8',
            },
            chem: {
              emerald: '#10B981',
              violet: '#A855F7',
              amber: '#F59E0B',
              crimson: '#EF4444'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090D16;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .neon-glow-cyan {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
    }
    .neon-glow-emerald {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }
    .neon-glow-violet {
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-obsidian-bg antialiased">

  <!-- Mobile Frame Container -->
  <div id="app" class="w-full max-w-md min-h-screen bg-obsidian-bg flex flex-col justify-between border-x border-obsidian-border/50 relative shadow-2xl">

    <!-- Top Header -->
    <header class="p-4 border-b border-obsidian-border/60 bg-obsidian-surface/90 backdrop-blur sticky top-0 z-40 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-neon-cyan/15 border border-neon-cyan/50 flex items-center justify-center text-neon-cyan font-mono font-black text-sm">
          QM
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-tight tracking-tight text-white flex items-center gap-1.5">
            QuizMaster
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-chem-violet/20 border border-chem-violet/40 text-chem-violet font-semibold">WEB</span>
          </h1>
          <p class="text-xs text-slate-400">Química Orgánica & Inorgánica</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Streak -->
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-chem-amber/15 border border-chem-amber/40 text-chem-amber text-xs font-bold">
          <span>🔥</span>
          <span id="streak-counter">3 d</span>
        </div>
        <!-- XP -->
        <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-chem-violet/15 border border-chem-violet/40 text-chem-violet text-xs font-bold">
          <span>⚡</span>
          <span id="xp-counter">450 XP</span>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Screen Content -->
    <main id="main-content" class="flex-1 p-4 pb-24 overflow-y-auto hide-scrollbar">
      <!-- Injected via JavaScript -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full max-w-md bg-obsidian-surface/95 border-t border-obsidian-border/80 backdrop-blur py-2 px-3 z-50 flex items-center justify-around">
      <button onclick="navigate('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-neon-cyan text-xs font-semibold py-1 px-2 transition-all">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13.5v5.5a2 2 0 01-2 2h-10a2 2 0 01-2-2v-5.5a4.5 4.5 0 012.3-3.92L11 3.86a2 2 0 012 0l3.7 2.22A4.5 4.5 0 0119 13.5z"/></svg>
        <span>Jugar</span>
      </button>

      <button onclick="navigate('duel')" id="nav-duel" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 text-xs font-semibold py-1 px-2 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span>Duelo 1v1</span>
      </button>

      <button onclick="navigate('create')" id="nav-create" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 text-xs font-semibold py-1 px-2 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Crear</span>
      </button>

      <button onclick="navigate('stats')" id="nav-stats" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 text-xs font-semibold py-1 px-2 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Progreso</span>
      </button>

      <button onclick="navigate('ranking')" id="nav-ranking" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 text-xs font-semibold py-1 px-2 transition-all">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
        <span>Ranking</span>
      </button>
    </nav>
  </div>

  <!-- State & App Script -->
  <script>
    // State storage with localStorage persistence
    const state = {
      xp: parseInt(localStorage.getItem('qm_xp') || '450'),
      streak: parseInt(localStorage.getItem('qm_streak') || '3'),
      categoryFilter: 'ALL', // 'ALL', 'ORGANIC', 'INORGANIC'
      currentScreen: 'home',
      activeQuiz: null,
      quizStep: 0,
      quizScore: 0,
      quizTimer: 25,
      timerInterval: null,
      customQuizzes: JSON.parse(localStorage.getItem('qm_custom_quizzes') || '[]'),
      masteredCompounds: JSON.parse(localStorage.getItem('qm_mastered') || '["CH₄", "H₂SO₄"]'),
      duelState: {
        active: false,
        timeLeft: 12,
        userScore: 0,
        oppScore: 0,
        round: 0,
        fiftyUsed: false,
        timerUsed: false,

    // Chemistry Question Database
    const chemistryDB = [

        correct: 1,

      // Intermedio

          "Por su tensión angular de anillo"
        ],
        correct: 0,

      {

          "Adición oxidativa (el Ir pasa de +1 a +3 y la coordinación de 4 a 6)",
          "Eliminación reductora bimolecular",

        ],
        correct: 0,
        explanation: "Es un complejo d⁸ de 16 electrones con Iridio(I) cuadrado plano. Al reaccionar con O₂ o H₂, se convierte en un complejo octaédrico d⁶ de 18 electrones con Iridio(III), aumentando su estado de oxidación y número de coordinación.",

      }
    ];

    // Navigation System
    function navigate(screen) {
      state.currentScreen = screen;
      clearInterval(state.timerInterval);

      // Update Nav active styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-neon-cyan');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${screen}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-neon-cyan');
      }

      renderScreen();
    }

    function renderScreen() {
      const main = document.getElementById('main-content');
      document.getElementById('xp-counter').textContent = `${state.xp} XP`;
      document.getElementById('streak-counter').textContent = `${state.streak} d`;

      switch (state.currentScreen) {
        case 'home':
          main.innerHTML = getHomeScreenHTML();
          break;
        case 'quiz':
          main.innerHTML = getQuizScreenHTML();
          break;
        case 'duel':
          main.innerHTML = getDuelScreenHTML();
          break;
        case 'create':
          main.innerHTML = getCreateScreenHTML();
          break;
        case 'stats':
          main.innerHTML = getStatsScreenHTML();
          break;
        case 'ranking':
          main.innerHTML = getRankingScreenHTML();
          break;
      }
    }

    // --- SCREEN TEMPLATES ---

        if (state.categoryFilter === 'ALL') return true;
        return q.type === state.categoryFilter;
      });

                🧪 Todos
              </button>
              <button onclick="setFilter('ORGANIC')" class="py-2 px-1 text-xs font-bold rounded-xl border transition-all ${state.categoryFilter === 'ORGANIC' ? 'bg-chem-emerald/20 border-chem-emerald text-white' : 'bg-obsidian-card border-obsidian-border text-slate-400'}">
                🌿 Orgánicos
              </button>
              <button onclick="setFilter('INORGANIC')" class="py-2 px-1 text-xs font-bold rounded-xl border transition-all ${state.categoryFilter === 'INORGANIC' ? 'bg-neon-cyan/20 border-neon-cyan text-white' : 'bg-obsidian-card border-obsidian-border text-slate-400'}">

          </div>

            <div onclick="startLevelQuiz(1)" class="p-4 rounded-xl bg-obsidian-card border border-chem-emerald/40 hover:border-chem-emerald cursor-pointer flex items-center justify-between transition-all">

                <div class="w-11 h-11 rounded-full bg-chem-emerald/20 border border-chem-emerald text-chem-emerald font-black text-lg flex items-center justify-center">1</div>
                <div>
                  <div class="flex items-center gap-2">
                    <h4 class="font-bold text-white text-sm">Principiante</h4>
                    <span class="text-[10px] text-chem-emerald font-mono">★☆☆☆</span>
                  </div>
                  <p class="text-xs text-slate-400 mt-0.5">CH₄, H₂SO₄, nomenclatura IUPAC y sales neutras.</p>

                </div>
              </div>
              <div class="text-chem-emerald text-lg">▶</div>
            </div>

            <!-- Level 2 -->
            <div onclick="startLevelQuiz(2)" class="p-4 rounded-xl bg-obsidian-card border border-neon-cyan/40 hover:border-neon-cyan cursor-pointer flex items-center justify-between transition-all">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-neon-cyan/20 border border-neon-cyan text-neon-cyan font-black text-lg flex items-center justify-center">2</div>
                <div>
                  <div class="flex items-center gap-2">
                    <h4 class="font-bold text-white text-sm">Intermedio</h4>

                  </div>

                <div class="w-11 h-11 rounded-full bg-chem-amber/20 border border-chem-amber text-chem-amber font-black text-lg flex items-center justify-center">3</div>
                <div>

    function startLevelQuiz(level) {
      let pool = chemistryDB.filter(q => q.level === level);

        if (filtered.length > 0) pool = filtered;
      }
      state.activeQuiz = {
        title: `Nivel ${level} • ${state.categoryFilter}`,
        questions: pool,
        currentIndex: 0,
        selectedIdx: null,
        answered: false
      };
      state.currentScreen = 'quiz';
      startQuizTimer();
      renderScreen();
    }

    function startQuizTimer() {
      state.quizTimer = 25;
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        state.quizTimer--;
        const timerEl = document.getElementById('quiz-timer');
        if (timerEl) {
          timerEl.textContent = `${state.quizTimer}s`;
          if (state.quizTimer <= 5) {
            timerEl.classList.add('text-chem-crimson');
          }
        }
        if (state.quizTimer <= 0) {
          clearInterval(state.timerInterval);
          if (!state.activeQuiz.answered) {
            selectQuizAnswer(-1); // timeout
          }
        }
      }, 1000);
    }

    function getQuizScreenHTML() {

          <div class="w-full h-1.5 bg-obsidian-card rounded-full overflow-hidden">

                <span class="text-xs font-semibold text-slate-300">${q.name}</span>
              </div>
              <span class="text-[11px] px-2 py-0.5 rounded bg-obsidian-surface border border-obsidian-border text-slate-400">${q.type === 'ORGANIC' ? 'Orgánico' : 'Inorgánico'}</span>

                  <span class="text-xs font-medium leading-snug flex-1">${opt}</span>
                </button>
              `;

          </div>

          <!-- Explanation Card (Visible once answered) -->
          ${isAnswered ? `
            <div class="p-4 rounded-xl bg-obsidian-card border ${state.activeQuiz.selectedIdx === q.correct ? 'border-chem-emerald' : 'border-chem-crimson'} space-y-2">
              <div class="flex items-center gap-2">
                <span class="text-lg">${state.activeQuiz.selectedIdx === q.correct ? '✅ ¡Correcto!' : '❌ Incorrecto'}</span>
                <span class="text-xs text-slate-400 font-semibold">${state.activeQuiz.selectedIdx === q.correct ? `+${q.xp} XP ganados` : '+0 XP'}</span>

    function selectQuizAnswer(idx) {
      clearInterval(state.timerInterval);
      state.activeQuiz.selectedIdx = idx;
      state.activeQuiz.answered = true;

      const q = state.activeQuiz.questions[state.activeQuiz.currentIndex];
      if (idx === q.correct) {
        state.xp += q.xp;
        localStorage.setItem('qm_xp', state.xp);
        if (!state.masteredCompounds.includes(q.formula)) {
          state.masteredCompounds.push(q.formula);
          localStorage.setItem('qm_mastered', JSON.stringify(state.masteredCompounds));
        }
      }
      renderScreen();
    }

    function nextQuizQuestion() {
      if (state.activeQuiz.currentIndex + 1 < state.activeQuiz.questions.length) {
        state.activeQuiz.currentIndex++;
        state.activeQuiz.answered = false;
        state.activeQuiz.selectedIdx = null;
        startQuizTimer();
        renderScreen();

    function useDuelPowerUp(type) {
      if (type === 'fifty') {
        state.duelState.fiftyUsed = true;
        alert("Comodín 50/50 Covalente activado: Dos opciones incorrectas han sido eliminadas por espectrometría.");
      } else if (type === 'catalyst') {
        state.duelState.timerUsed = true;
        state.duelState.timeLeft += 6;
      } else if (type === 'spectro') {
        state.duelState.spectroUsed = true;
        const q = state.duelState.questions[state.duelState.round];
        alert(`Pista de Espectrometría: ${q.fact}`);

      renderScreen();
    }

    function submitDuelChoice(choice) {
      clearInterval(state.timerInterval);
      const d = state.duelState;
      const q = d.questions[d.round];
      d.answered = true;
      d.userChoice = choice;

      if (choice === q.correct) {
        d.userScore += 100 + (d.timeLeft * 5);
      }
      // Simulate opponent score
      if (Math.random() > 0.3) {
        d.oppScore += 100 + Math.floor(Math.random() * 30);
      }
      renderScreen();
    }

      const d = state.duelState;
      if (d.round + 1 < d.questions.length) {

        d.answered = false;
        d.userChoice = null;

        renderScreen();

        alert(won ? `🏆 ¡Victoria Alquímica! Superaste a tu rival y ganaste +${xpDelta} XP.` : `¡Buen combate! Sumaste +${xpDelta} XP por esfuerzo.`);

      }
    }

          <div class="space-y-2">
            ${topUsers.map(u => `
              <div class="p-3 rounded-xl border flex items-center justify-between ${u.isSelf ? 'bg-neon-cyan/10 border-neon-cyan' : 'bg-obsidian-card border-obsidian-border'}">
                <div class="flex items-center gap-3">
                  <span class="text-base font-black w-6 text-center">${u.medal}</span>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-xs text-white">${u.name}</span>
                      ${u.isSelf ? '<span class="text-[9px] px-1 rounded bg-neon-cyan text-obsidian-bg font-bold">TÚ</span>' : ''}
                    </div>
                    <span class="text-[11px] text-slate-400">${u.school}</span>
                  </div>
                </div>
                <div class="text-right">
                  <span class="font-mono font-bold text-xs text-neon-cyan block">${u.xp} XP</span>
                  <span class="text-[10px] text-chem-emerald">${u.win} victorias</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Initialize View
    navigate('home');
  </script>
</body>
